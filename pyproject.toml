[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profmatch"
version = "0.1.0"
description = "Find the right professor for your interests and preferred challenge level"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
scrape = ["httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
embed = ["sentence-transformers>=2.6"]
all = ["profmatch[scrape,api,embed]"]
dev = ["pytest>=8"]

[project.scripts]
profmatch = "profmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
